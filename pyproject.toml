[project]
name = "clinical-trials-rag-snowflake"
version = "0.1.0"
description = "Reference implementation of a clinical-trials AI assistant on Snowflake: ELT in SQL, Cortex embeddings, vector search with phase filters, answers that cite their NCT records."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Owlab" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "snowflake-connector-python>=3.12",
]

[project.scripts]
ctrag = "ctrag.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PT", "ARG", "S", "RUF", "PL",
]
ignore = [
    "PLR2004", # magic numbers are fine in tests and thresholds
    "PLR0913", # CLI wiring takes many args
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["snowflake.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["snowflake: needs a live Snowflake account (skipped unless CTRAG_LIVE_TESTS=1)"]
